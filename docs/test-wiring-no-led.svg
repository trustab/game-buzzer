<svg viewBox="0 0 500 320" xmlns="http://www.w3.org/2000/svg" font-family="monospace" font-size="11" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <rect width="500" height="320" fill="#0a0a0f"/>

  <text x="250" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#f0e040" letter-spacing="3">ONE BUTTON TEST — NO LED</text>
  <text x="250" y="44" text-anchor="middle" font-size="9" fill="#555570">D2 signal · GND · two wires only</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- ARDUINO -->
  <!-- ═══════════════════════════════════════════════════ -->
  <rect x="40" y="70" width="150" height="200" rx="8" fill="#1a2a1a" stroke="#2a5a2a" stroke-width="2"/>
  <text x="115" y="92" text-anchor="middle" font-size="11" font-weight="bold" fill="#4daa4d">Arduino</text>
  <text x="115" y="106" text-anchor="middle" font-size="9" fill="#4daa4d">UNO R4 WiFi</text>

  <!-- USB -->
  <rect x="50" y="118" width="58" height="16" rx="3" fill="#0e1e0e" stroke="#2a4a2a" stroke-width="1"/>
  <text x="79" y="130" text-anchor="middle" font-size="8" fill="#4daa4d">USB-C</text>

  <!-- D2 pin -->
  <circle cx="190" cy="180" r="4" fill="#ff4d6d"/>
  <text x="182" y="184" text-anchor="end" font-size="9" fill="#ff4d6d">D2</text>

  <!-- GND pin -->
  <circle cx="190" cy="210" r="4" fill="#44ff44"/>
  <text x="182" y="214" text-anchor="end" font-size="9" fill="#44ff44">GND</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- BUTTON -->
  <!-- ═══════════════════════════════════════════════════ -->
  <rect x="320" y="140" width="110" height="100" rx="36" fill="#2a1010" stroke="#ff4d6d" stroke-width="2.5"/>

  <!-- simple switch symbol -->
  <line x1="346" y1="192" x2="360" y2="192" stroke="#ff4d6d" stroke-width="2.5"/>
  <line x1="362" y1="184" x2="376" y2="192" stroke="#ff4d6d" stroke-width="2.5"/>
  <line x1="376" y1="192" x2="390" y2="192" stroke="#ff4d6d" stroke-width="2.5"/>
  <circle cx="346" cy="192" r="3" fill="#ff4d6d"/>
  <circle cx="390" cy="192" r="3" fill="#ff4d6d"/>

  <text x="375" y="225" text-anchor="middle" font-size="10" font-weight="bold" fill="#ff4d6d">BUTTON 1</text>

  <!-- Terminal dots -->
  <circle cx="320" cy="185" r="3.5" fill="#ff4d6d"/>  <!-- NO -->
  <circle cx="320" cy="205" r="3.5" fill="#44ff44"/>  <!-- COM -->

  <!-- Terminal labels -->
  <text x="316" y="183" text-anchor="end" font-size="8" fill="#ff4d6d">NO</text>
  <text x="316" y="208" text-anchor="end" font-size="8" fill="#44ff44">COM</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- WIRES -->
  <!-- ═══════════════════════════════════════════════════ -->

  <!-- D2 → NO -->
  <line x1="190" y1="180" x2="320" y2="180" stroke="#ff4d6d" stroke-width="2.5"/>
  <line x1="320" y1="180" x2="320" y2="185" stroke="#ff4d6d" stroke-width="2.5"/>

  <!-- GND → COM -->
  <line x1="190" y1="210" x2="320" y2="210" stroke="#44ff44" stroke-width="2.5"/>
  <line x1="320" y1="205" x2="320" y2="210" stroke="#44ff44" stroke-width="2.5"/>

  <!-- wire labels -->
  <text x="255" y="172" text-anchor="middle" font-size="8" fill="#ff4d6d">signal</text>
  <text x="255" y="224" text-anchor="middle" font-size="8" fill="#44ff44">GND</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- NOTES -->
  <!-- ═══════════════════════════════════════════════════ -->
  <rect x="40" y="290" width="420" height="20" rx="4" fill="#0f0f18" stroke="#1e1e30" stroke-width="1"/>
  <text x="250" y="304" text-anchor="middle" font-size="9" fill="#555570">
    INPUT_PULLUP — pin reads HIGH normally, LOW when button pressed · no resistor needed
  </text>

</svg>
