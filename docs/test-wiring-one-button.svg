<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" font-family="monospace" font-size="11" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <rect width="640" height="420" fill="#0a0a0f"/>

  <text x="320" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#f0e040" letter-spacing="3">ONE BUTTON TEST WIRING</text>
  <text x="320" y="44" text-anchor="middle" font-size="9" fill="#555570">Arduino UNO R4 WiFi · Player 1 only · D2 signal · D3 LED</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- ARDUINO -->
  <!-- ═══════════════════════════════════════════════════ -->
  <rect x="30" y="70" width="150" height="300" rx="8" fill="#1a2a1a" stroke="#2a5a2a" stroke-width="2"/>
  <text x="105" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#4daa4d">Arduino</text>
  <text x="105" y="104" text-anchor="middle" font-size="9" fill="#4daa4d">UNO R4 WiFi</text>

  <!-- USB -->
  <rect x="40" y="112" width="58" height="16" rx="3" fill="#0e1e0e" stroke="#2a4a2a" stroke-width="1"/>
  <text x="69" y="124" text-anchor="middle" font-size="8" fill="#4daa4d">USB-C</text>

  <!-- Pin rows on right side -->
  <!-- D2 -->
  <circle cx="180" cy="175" r="4" fill="#ff4d6d"/>
  <line x1="155" y1="175" x2="180" y2="175" stroke="#1e1e30" stroke-width="1"/>
  <text x="152" y="179" text-anchor="end" font-size="9" fill="#ff4d6d">D2</text>

  <!-- D3 -->
  <circle cx="180" cy="205" r="4" fill="#ff8888"/>
  <line x1="155" y1="205" x2="180" y2="205" stroke="#1e1e30" stroke-width="1"/>
  <text x="152" y="209" text-anchor="end" font-size="9" fill="#ff8888">D3~</text>

  <!-- GND -->
  <circle cx="180" cy="235" r="4" fill="#44ff44"/>
  <line x1="155" y1="235" x2="180" y2="235" stroke="#1e1e30" stroke-width="1"/>
  <text x="152" y="239" text-anchor="end" font-size="9" fill="#44ff44">GND</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- RESISTOR -->
  <!-- ═══════════════════════════════════════════════════ -->

  <!-- D3 → resistor -->
  <line x1="180" y1="205" x2="280" y2="205" stroke="#ff8888" stroke-width="2"/>
  <rect x="280" y="197" width="44" height="16" rx="3" fill="#1a1a1a" stroke="#ff8888" stroke-width="1.5"/>
  <text x="302" y="209" text-anchor="middle" font-size="8" fill="#ff8888">220Ω</text>
  <!-- resistor → button LED+ -->
  <line x1="324" y1="205" x2="390" y2="205" stroke="#ff8888" stroke-width="2"/>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- BUTTON -->
  <!-- ═══════════════════════════════════════════════════ -->
  <rect x="390" y="155" width="110" height="140" rx="40" fill="#2a1010" stroke="#ff4d6d" stroke-width="2.5"/>

  <!-- LED symbol -->
  <circle cx="445" cy="195" r="14" fill="none" stroke="#ff4d6d" stroke-width="1.5"/>
  <!-- LED triangle -->
  <polygon points="438,188 438,202 450,195" fill="#ff4d6d" opacity="0.6"/>
  <line x1="450" y1="188" x2="450" y2="202" stroke="#ff4d6d" stroke-width="1.5"/>
  <!-- glow lines -->
  <line x1="453" y1="186" x2="458" y2="181" stroke="#ff4d6d" stroke-width="1" opacity="0.5"/>
  <line x1="456" y1="192" x2="462" y2="190" stroke="#ff4d6d" stroke-width="1" opacity="0.5"/>

  <!-- switch symbol -->
  <line x1="427" y1="232" x2="438" y2="232" stroke="#ff4d6d" stroke-width="2"/>
  <line x1="440" y1="226" x2="452" y2="232" stroke="#ff4d6d" stroke-width="2"/>
  <line x1="452" y1="232" x2="463" y2="232" stroke="#ff4d6d" stroke-width="2"/>
  <!-- switch dots -->
  <circle cx="427" cy="232" r="2.5" fill="#ff4d6d"/>
  <circle cx="463" cy="232" r="2.5" fill="#ff4d6d"/>

  <text x="445" y="272" text-anchor="middle" font-size="10" font-weight="bold" fill="#ff4d6d">BUTTON 1</text>

  <!-- Button terminal labels -->
  <text x="388" y="200" text-anchor="end" font-size="8" fill="#ff8888">LED+</text>
  <text x="388" y="235" text-anchor="end" font-size="8" fill="#44ff44">COM</text>
  <text x="502" y="235" font-size="8" fill="#ff4d6d">NO</text>

  <!-- Terminal dots on button edge -->
  <circle cx="390" cy="197" r="3" fill="#ff8888"/>  <!-- LED+ -->
  <circle cx="390" cy="230" r="3" fill="#44ff44"/>  <!-- COM/GND -->
  <circle cx="500" cy="230" r="3" fill="#ff4d6d"/>  <!-- NO signal -->

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- WIRES -->
  <!-- ═══════════════════════════════════════════════════ -->

  <!-- D2 → NO (signal wire, routes around button) -->
  <line x1="180" y1="175" x2="540" y2="175" stroke="#ff4d6d" stroke-width="2"/>
  <line x1="540" y1="175" x2="540" y2="230" stroke="#ff4d6d" stroke-width="2"/>
  <line x1="500" y1="230" x2="540" y2="230" stroke="#ff4d6d" stroke-width="2"/>

  <!-- GND → COM -->
  <line x1="180" y1="235" x2="370" y2="235" stroke="#44ff44" stroke-width="2"/>
  <line x1="370" y1="230" x2="390" y2="230" stroke="#44ff44" stroke-width="2"/>
  <line x1="370" y1="230" x2="370" y2="235" stroke="#44ff44" stroke-width="2"/>

  <!-- wire join dots -->
  <circle cx="370" cy="230" r="3.5" fill="#44ff44"/>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- WIRE LABELS -->
  <!-- ═══════════════════════════════════════════════════ -->
  <text x="240" y="170" text-anchor="middle" font-size="8" fill="#ff4d6d">signal</text>
  <text x="350" y="198" text-anchor="middle" font-size="8" fill="#ff8888">LED+</text>
  <text x="280" y="252" text-anchor="middle" font-size="8" fill="#44ff44">GND</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- NOTES BOX -->
  <!-- ═══════════════════════════════════════════════════ -->
  <rect x="30" y="385" width="580" height="25" rx="4" fill="#0f0f18" stroke="#1e1e30" stroke-width="1"/>
  <text x="320" y="401" text-anchor="middle" font-size="9" fill="#555570">
    COM = switch + LED shared ground · NO = normally open switch contact · LED+ via 220Ω to D3 · signal via D2 INPUT_PULLUP
  </text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- SUMMARY TABLE -->
  <!-- ═══════════════════════════════════════════════════ -->
  <rect x="30" y="310" width="150" height="68" rx="5" fill="#0f0f18" stroke="#1e1e30" stroke-width="1"/>
  <text x="105" y="326" text-anchor="middle" font-size="9" font-weight="bold" fill="#888899" letter-spacing="1">CONNECTIONS</text>
  <line x1="38" y1="330" x2="172" y2="330" stroke="#1e1e30" stroke-width="1"/>

  <circle cx="44" cy="342" r="3" fill="#ff4d6d"/>
  <text x="52" y="346" font-size="8" fill="#ccc">D2  →  Button NO</text>

  <circle cx="44" cy="357" r="3" fill="#ff8888"/>
  <text x="52" y="361" font-size="8" fill="#ccc">D3  →  220Ω  →  LED+</text>

  <circle cx="44" cy="372" r="3" fill="#44ff44"/>
  <text x="52" y="376" font-size="8" fill="#ccc">GND →  Button COM</text>

</svg>
