<svg viewBox="0 0 700 520" xmlns="http://www.w3.org/2000/svg" font-family="monospace" font-size="11" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <rect width="700" height="520" fill="#0a0a0f"/>

  <text x="350" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#f0e040" letter-spacing="3">ESP32-C3 BRACKET — SLIDE-IN RAILS</text>
  <text x="350" y="44" text-anchor="middle" font-size="9" fill="#555570">Top view · Side view · Detail</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- TOP VIEW -->
  <!-- ═══════════════════════════════════════════════════ -->
  <text x="180" y="68" text-anchor="middle" font-size="10" font-weight="bold" fill="#888899" letter-spacing="2">TOP VIEW</text>

  <!-- Bracket outer walls -->
  <rect x="60" y="80" width="240" height="180" rx="4" fill="#13131a" stroke="#4daaff" stroke-width="2"/>

  <!-- Left rail -->
  <rect x="60" y="80" width="20" height="180" rx="2" fill="#1e2a3a" stroke="#4daaff" stroke-width="1.5"/>
  <!-- Right rail -->
  <rect x="280" y="80" width="20" height="180" rx="2" fill="#1e2a3a" stroke="#4daaff" stroke-width="1.5"/>

  <!-- Rail grooves (the actual slot the board slides into) -->
  <rect x="75" y="80" width="8" height="180" fill="#0a0a0f" stroke="#4daaff44" stroke-width="1"/>
  <rect x="277" y="80" width="8" height="180" fill="#0a0a0f" stroke="#4daaff44" stroke-width="1"/>

  <!-- End stop wall (closed end, top) -->
  <rect x="80" y="80" width="200" height="18" rx="2" fill="#1e2a3a" stroke="#4daaff" stroke-width="1.5"/>

  <!-- Snap lip detail on closed end -->
  <rect x="140" y="80" width="80" height="10" rx="2" fill="#f0e040" opacity="0.8"/>
  <text x="180" y="89" text-anchor="middle" font-size="7" fill="#000" font-weight="bold">SNAP LIP</text>

  <!-- Open end (bottom) — slide in from here -->
  <line x1="80" y1="260" x2="280" y2="260" stroke="#4daaff" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="180" y="275" text-anchor="middle" font-size="9" fill="#4daaff">← slide in from this end</text>

  <!-- ESP32 board inside bracket -->
  <rect x="83" y="105" width="194" height="148" rx="2" fill="#1a1020" stroke="#cc88cc" stroke-width="1.5"/>
  <text x="180" y="175" text-anchor="middle" font-size="9" font-weight="bold" fill="#cc88cc">ESP32-C3</text>
  <text x="180" y="190" text-anchor="middle" font-size="8" fill="#cc88cc">20 × 25mm</text>

  <!-- Antenna corner cutout -->
  <rect x="83" y="105" width="30" height="20" rx="2" fill="#0a0a0f" stroke="#ff9f4d" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="98" y="120" text-anchor="middle" font-size="6" fill="#ff9f4d">ANT</text>

  <!-- Pin header reliefs on sides -->
  <rect x="60" y="120" width="23" height="12" rx="1" fill="#0a0a0f" stroke="#ff4d6d" stroke-width="1"/>
  <rect x="60" y="210" width="23" height="12" rx="1" fill="#0a0a0f" stroke="#ff4d6d" stroke-width="1"/>
  <rect x="277" y="120" width="23" height="12" rx="1" fill="#0a0a0f" stroke="#ff4d6d" stroke-width="1"/>
  <rect x="277" y="210" width="23" height="12" rx="1" fill="#0a0a0f" stroke="#ff4d6d" stroke-width="1"/>
  <text x="32" y="128" text-anchor="middle" font-size="6" fill="#ff4d6d">PIN</text>
  <text x="32" y="218" text-anchor="middle" font-size="6" fill="#ff4d6d">PIN</text>

  <!-- Dimension arrows top view -->
  <!-- Width -->
  <line x1="60" y1="295" x2="300" y2="295" stroke="#555570" stroke-width="1"/>
  <line x1="60" y1="290" x2="60" y2="300" stroke="#555570" stroke-width="1"/>
  <line x1="300" y1="290" x2="300" y2="300" stroke="#555570" stroke-width="1"/>
  <text x="180" y="308" text-anchor="middle" font-size="8" fill="#555570">24mm (20 + 2mm walls + 0.2mm gap each side)</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- SIDE VIEW -->
  <!-- ═══════════════════════════════════════════════════ -->
  <text x="520" y="68" text-anchor="middle" font-size="10" font-weight="bold" fill="#888899" letter-spacing="2">SIDE VIEW</text>

  <!-- Base -->
  <rect x="400" y="240" width="240" height="15" rx="3" fill="#1e2a3a" stroke="#4daaff" stroke-width="1.5"/>
  <text x="520" y="252" text-anchor="middle" font-size="8" fill="#4daaff">base 1.5mm</text>

  <!-- Left wall with rail groove -->
  <rect x="400" y="100" width="20" height="140" rx="2" fill="#1e2a3a" stroke="#4daaff" stroke-width="1.5"/>
  <!-- groove -->
  <rect x="415" y="100" width="5" height="140" fill="#0a0a0f" stroke="#4daaff44" stroke-width="1"/>
  <text x="390" y="175" text-anchor="end" font-size="8" fill="#4daaff">rail</text>
  <text x="390" y="186" text-anchor="end" font-size="8" fill="#4daaff">groove</text>

  <!-- Right wall -->
  <rect x="620" y="100" width="20" height="140" rx="2" fill="#1e2a3a" stroke="#4daaff" stroke-width="1.5"/>
  <rect x="620" y="100" width="5" height="140" fill="#0a0a0f" stroke="#4daaff44" stroke-width="1"/>

  <!-- Snap lip on closed end (left side in side view) -->
  <rect x="420" y="95" width="220" height="15" rx="2" fill="#1e2a3a" stroke="#4daaff" stroke-width="1.5"/>
  <!-- snap lip protrusion -->
  <rect x="490" y="107" width="60" height="6" rx="2" fill="#f0e040"/>
  <text x="520" y="114" text-anchor="middle" font-size="7" fill="#000" font-weight="bold">1mm lip</text>

  <!-- Board in side view -->
  <rect x="420" y="113" width="220" height="8" rx="1" fill="#1a1020" stroke="#cc88cc" stroke-width="1.5"/>
  <text x="650" y="120" font-size="8" fill="#cc88cc">  board 1mm</text>

  <!-- open end arrow -->
  <line x1="420" y1="255" x2="640" y2="255" stroke="#4daaff" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="520" y="270" text-anchor="middle" font-size="8" fill="#4daaff">open end — slide board in</text>

  <!-- wall height dimension -->
  <line x1="650" y1="100" x2="650" y2="240" stroke="#555570" stroke-width="1"/>
  <line x1="645" y1="100" x2="655" y2="100" stroke="#555570" stroke-width="1"/>
  <line x1="645" y1="240" x2="655" y2="240" stroke="#555570" stroke-width="1"/>
  <text x="668" y="175" text-anchor="start" font-size="8" fill="#555570">wall</text>
  <text x="668" y="186" text-anchor="start" font-size="8" fill="#555570">~10mm</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- SNAP LIP DETAIL -->
  <!-- ═══════════════════════════════════════════════════ -->
  <text x="180" y="330" text-anchor="middle" font-size="10" font-weight="bold" fill="#888899" letter-spacing="2">SNAP LIP DETAIL  (cross section)</text>

  <!-- wall -->
  <rect x="100" y="350" width="160" height="30" rx="2" fill="#1e2a3a" stroke="#4daaff" stroke-width="1.5"/>
  <text x="180" y="370" text-anchor="middle" font-size="8" fill="#4daaff">end stop wall</text>

  <!-- snap lip -->
  <path d="M 160,350 L 220,350 L 220,344 L 200,340 L 160,344 Z" fill="#f0e040" opacity="0.9"/>
  <text x="190" y="348" text-anchor="middle" font-size="7" fill="#000" font-weight="bold">snap lip 1mm</text>

  <!-- board sliding in arrow -->
  <line x1="310" y1="358" x2="230" y2="358" stroke="#cc88cc" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="310" y="353" width="80" height="10" rx="1" fill="#1a1020" stroke="#cc88cc" stroke-width="1.5"/>
  <text x="350" y="362" text-anchor="middle" font-size="8" fill="#cc88cc">board</text>

  <text x="180" y="410" text-anchor="middle" font-size="8" fill="#555570">Board edge deflects lip as it slides past,</text>
  <text x="180" y="422" text-anchor="middle" font-size="8" fill="#555570">then lip snaps back to retain board.</text>
  <text x="180" y="438" text-anchor="middle" font-size="8" fill="#f0e040">Thin wall behind lip (1.5mm) allows flex.</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- LEGEND -->
  <!-- ═══════════════════════════════════════════════════ -->
  <rect x="400" y="330" width="260" height="130" rx="6" fill="#0f0f18" stroke="#1e1e30" stroke-width="1"/>
  <text x="530" y="348" text-anchor="middle" font-size="9" font-weight="bold" fill="#888899" letter-spacing="2">KEY DIMENSIONS</text>
  <line x1="408" y1="352" x2="652" y2="352" stroke="#1e1e30" stroke-width="1"/>
  <text x="415" y="367" font-size="8" fill="#ccc">Inner cavity</text>
  <text x="570" y="367" font-size="8" fill="#f0e040">20.4 × 25.4mm</text>
  <text x="415" y="382" font-size="8" fill="#ccc">Wall thickness</text>
  <text x="570" y="382" font-size="8" fill="#f0e040">2mm</text>
  <text x="415" y="397" font-size="8" fill="#ccc">Base thickness</text>
  <text x="570" y="397" font-size="8" fill="#f0e040">1.5mm</text>
  <text x="415" y="412" font-size="8" fill="#ccc">Wall height</text>
  <text x="570" y="412" font-size="8" fill="#f0e040">~10mm</text>
  <text x="415" y="427" font-size="8" fill="#ccc">Snap lip height</text>
  <text x="570" y="427" font-size="8" fill="#f0e040">1mm proud of rail</text>
  <text x="415" y="442" font-size="8" fill="#ccc">Print tolerance gap</text>
  <text x="570" y="442" font-size="8" fill="#f0e040">0.2mm each side</text>
  <text x="415" y="457" font-size="8" fill="#ccc">Pin header relief</text>
  <text x="570" y="457" font-size="8" fill="#ff4d6d">cut out rail at pin positions</text>

  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#cc88cc"/>
    </marker>
  </defs>

</svg>
