<svg viewBox="0 0 620 420" xmlns="http://www.w3.org/2000/svg" font-family="monospace" font-size="11" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <rect width="620" height="420" fill="#0a0a0f"/>

  <text x="310" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#f0e040" letter-spacing="3">BATTERY VOLTAGE MONITOR</text>
  <text x="310" y="44" text-anchor="middle" font-size="9" fill="#555570">3× AA (4.5V) · Voltage divider · ESP32-C3 ADC pin</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- BATTERY PACK -->
  <!-- ═══════════════════════════════════════════════════ -->
  <rect x="30" y="80" width="100" height="200" rx="8" fill="#1a1a10" stroke="#f0e040" stroke-width="2"/>
  <text x="80" y="100" text-anchor="middle" font-size="10" font-weight="bold" fill="#f0e040">3× AA</text>

  <!-- individual cells -->
  <rect x="45" y="108" width="70" height="44" rx="4" fill="#0e0e08" stroke="#f0e04066" stroke-width="1"/>
  <text x="80" y="134" text-anchor="middle" font-size="9" fill="#f0e040">1.5V</text>
  <rect x="45" y="158" width="70" height="44" rx="4" fill="#0e0e08" stroke="#f0e04066" stroke-width="1"/>
  <text x="80" y="184" text-anchor="middle" font-size="9" fill="#f0e040">1.5V</text>
  <rect x="45" y="208" width="70" height="44" rx="4" fill="#0e0e08" stroke="#f0e04066" stroke-width="1"/>
  <text x="80" y="234" text-anchor="middle" font-size="9" fill="#f0e040">1.5V</text>

  <!-- BAT+ terminal -->
  <circle cx="130" cy="130" r="5" fill="#ff6666"/>
  <text x="138" y="134" font-size="9" fill="#ff6666">BAT+  4.5V</text>

  <!-- BAT- terminal -->
  <circle cx="130" cy="240" r="5" fill="#44ff44"/>
  <text x="138" y="244" font-size="9" fill="#44ff44">BAT−  GND</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- VOLTAGE DIVIDER -->
  <!-- ═══════════════════════════════════════════════════ -->

  <!-- BAT+ → R1 top -->
  <line x1="130" y1="130" x2="280" y2="130" stroke="#ff6666" stroke-width="2"/>

  <!-- R1 -->
  <rect x="280" y="118" width="60" height="24" rx="4" fill="#1a1a1a" stroke="#ff9f4d" stroke-width="1.5"/>
  <text x="310" y="134" text-anchor="middle" font-size="9" fill="#ff9f4d">R1 100kΩ</text>

  <!-- R1 bottom → junction -->
  <line x1="340" y1="130" x2="400" y2="130" stroke="#ff9f4d" stroke-width="2"/>

  <!-- junction dot -->
  <circle cx="400" cy="130" r="5" fill="#f0e040"/>

  <!-- junction → ADC wire down -->
  <line x1="400" y1="130" x2="400" y2="200" stroke="#f0e040" stroke-width="2"/>

  <!-- R2 — vertical -->
  <rect x="376" y="200" width="48" height="24" rx="4" fill="#1a1a1a" stroke="#ff9f4d" stroke-width="1.5"/>
  <text x="400" y="216" text-anchor="middle" font-size="9" fill="#ff9f4d">R2 100kΩ</text>

  <!-- R2 bottom → GND rail -->
  <line x1="400" y1="224" x2="400" y2="260" stroke="#44ff44" stroke-width="2"/>

  <!-- GND rail -->
  <line x1="130" y1="260" x2="500" y2="260" stroke="#44ff44" stroke-width="2"/>
  <line x1="130" y1="240" x2="130" y2="260" stroke="#44ff44" stroke-width="2"/>

  <!-- junction → ADC pin label -->
  <line x1="400" y1="130" x2="490" y2="130" stroke="#f0e040" stroke-width="2"/>
  <text x="420" y="120" text-anchor="middle" font-size="8" fill="#f0e040">~2.25V max</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- ESP32-C3 -->
  <!-- ═══════════════════════════════════════════════════ -->
  <rect x="490" y="80" width="110" height="220" rx="8" fill="#1a1020" stroke="#aa44aa" stroke-width="2"/>
  <text x="545" y="100" text-anchor="middle" font-size="10" font-weight="bold" fill="#cc88cc">ESP32-C3</text>
  <text x="545" y="113" text-anchor="middle" font-size="8" fill="#cc88cc">SuperMini</text>

  <!-- ADC pin -->
  <circle cx="490" cy="130" r="4" fill="#f0e040"/>
  <text x="498" y="134" font-size="8" fill="#f0e040">A0 / GPIO0</text>

  <!-- 5V pin -->
  <circle cx="490" cy="160" r="4" fill="#ff6666"/>
  <text x="498" y="164" font-size="8" fill="#ff6666">5V in</text>

  <!-- GND pin -->
  <circle cx="490" cy="190" r="4" fill="#44ff44"/>
  <text x="498" y="194" font-size="8" fill="#44ff44">GND</text>

  <!-- Button pin -->
  <circle cx="490" cy="220" r="4" fill="#ff4d6d"/>
  <text x="498" y="224" font-size="8" fill="#ff4d6d">Button pin</text>

  <!-- LED pin -->
  <circle cx="490" cy="250" r="4" fill="#ff8888"/>
  <text x="498" y="254" font-size="8" fill="#ff8888">LED pin</text>

  <!-- BAT+ → 5V pin -->
  <line x1="130" y1="130" x2="130" y2="155" stroke="#ff6666" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="130" y1="155" x2="480" y2="155" stroke="#ff6666" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="480" y1="155" x2="490" y2="160" stroke="#ff6666" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- GND rail → ESP GND -->
  <line x1="500" y1="260" x2="500" y2="190" stroke="#44ff44" stroke-width="2"/>
  <line x1="490" y1="190" x2="500" y2="190" stroke="#44ff44" stroke-width="1"/>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- VOLTAGE TABLE -->
  <!-- ═══════════════════════════════════════════════════ -->
  <rect x="30" y="310" width="260" height="90" rx="6" fill="#0f0f18" stroke="#1e1e30" stroke-width="1"/>
  <text x="160" y="328" text-anchor="middle" font-size="9" font-weight="bold" fill="#888899" letter-spacing="1">VOLTAGE DIVIDER READINGS</text>
  <line x1="38" y1="332" x2="282" y2="332" stroke="#1e1e30" stroke-width="1"/>

  <text x="45"  y="347" font-size="8" fill="#666">Battery</text>
  <text x="130" y="347" font-size="8" fill="#666">ADC reads</text>
  <text x="210" y="347" font-size="8" fill="#666">Level</text>
  <line x1="38" y1="351" x2="282" y2="351" stroke="#1e1e30" stroke-width="1"/>

  <circle cx="42" cy="362" r="3" fill="#4dff9e"/>
  <text x="50"  y="366" font-size="8" fill="#ccc">4.5V  (full)</text>
  <text x="130" y="366" font-size="8" fill="#ccc">2.25V</text>
  <text x="210" y="366" font-size="8" fill="#4dff9e">100%</text>

  <circle cx="42" cy="377" r="3" fill="#f0e040"/>
  <text x="50"  y="381" font-size="8" fill="#ccc">3.9V</text>
  <text x="130" y="381" font-size="8" fill="#ccc">1.95V</text>
  <text x="210" y="381" font-size="8" fill="#f0e040">~50%</text>

  <circle cx="42" cy="392" r="3" fill="#ff4d6d"/>
  <text x="50"  y="396" font-size="8" fill="#ccc">3.3V  (flat)</text>
  <text x="130" y="396" font-size="8" fill="#ccc">1.65V</text>
  <text x="210" y="396" font-size="8" fill="#ff4d6d">0%</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- NOTES -->
  <!-- ═══════════════════════════════════════════════════ -->
  <rect x="305" y="310" width="285" height="90" rx="6" fill="#0f0f18" stroke="#1e1e30" stroke-width="1"/>
  <text x="447" y="328" text-anchor="middle" font-size="9" font-weight="bold" fill="#888899" letter-spacing="1">NOTES</text>
  <line x1="313" y1="332" x2="582" y2="332" stroke="#1e1e30" stroke-width="1"/>
  <text x="318" y="347" font-size="8" fill="#aaa">· Both resistors equal → voltage halved</text>
  <text x="318" y="361" font-size="8" fill="#aaa">· 100kΩ draws only ~22µA from battery</text>
  <text x="318" y="375" font-size="8" fill="#aaa">· Any ADC-capable GPIO pin works</text>
  <text x="318" y="389" font-size="8" fill="#aaa">· Dashed line = existing power connection</text>

</svg>
