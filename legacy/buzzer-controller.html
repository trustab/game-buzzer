<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Buzzer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #0a0a0f;
    --surface:  #13131a;
    --border:   #1e1e2e;
    --accent:   #f0e040;
    --dim:      #2a2a3a;
    --text:     #e8e8f0;
    --muted:    #555570;

    --p1: #ff4d6d;
    --p2: #4daaff;
    --p3: #4dff9e;
    --p4: #ff9f4d;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem 4rem;
    overflow-x: hidden;
  }

  /* scanline overlay */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.07) 2px,
      rgba(0,0,0,0.07) 4px
    );
    pointer-events: none;
    z-index: 999;
  }

  header {
    text-align: center;
    margin-bottom: 2.5rem;
  }

  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(3rem, 10vw, 6rem);
    letter-spacing: 0.08em;
    color: var(--accent);
    text-shadow: 0 0 40px rgba(240,224,64,0.3);
    line-height: 1;
  }

  .subtitle {
    color: var(--muted);
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-top: 0.4rem;
  }

  /* Connection bar */
  .conn-bar {
    display: flex;
    align-items: center;
    gap: 1rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.75rem 1.25rem;
    margin-bottom: 2rem;
    width: 100%;
    max-width: 480px;
  }

  .conn-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
    transition: background 0.3s, box-shadow 0.3s;
  }
  .conn-dot.connected {
    background: #4dff9e;
    box-shadow: 0 0 10px rgba(77,255,158,0.6);
  }

  .conn-label {
    flex: 1;
    font-size: 0.8rem;
    color: var(--muted);
  }
  .conn-label.connected { color: var(--text); }

  .btn-connect {
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 4px;
    padding: 0.4rem 1rem;
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
  }
  .btn-connect:hover { opacity: 0.85; }
  .btn-connect:active { transform: scale(0.97); }
  .btn-connect:disabled { opacity: 0.35; cursor: not-allowed; }

  /* Status display */
  .status-display {
    width: 100%;
    max-width: 480px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    padding: 1.5rem;
    margin-bottom: 2rem;
    text-align: center;
    min-height: 140px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .status-display::before {
    content: '';
    position: absolute; inset: 0;
    border-radius: 8px;
    opacity: 0;
    transition: opacity 0.4s;
    pointer-events: none;
  }

  .status-display.buzzed::before {
    opacity: 1;
    background: radial-gradient(ellipse at center, var(--buzz-glow) 0%, transparent 70%);
  }

  .status-label {
    font-size: 0.65rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.75rem;
  }

  .status-value {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2rem, 8vw, 3.5rem);
    letter-spacing: 0.05em;
    line-height: 1;
    transition: color 0.3s;
  }

  .status-sub {
    font-size: 0.7rem;
    color: var(--muted);
    margin-top: 0.6rem;
    letter-spacing: 0.15em;
  }

  /* Flashing animation for ROUND_ACTIVE */
  @keyframes pulse-ring {
    0% { box-shadow: 0 0 0 0 rgba(240,224,64,0.4); }
    70% { box-shadow: 0 0 0 20px rgba(240,224,64,0); }
    100% { box-shadow: 0 0 0 0 rgba(240,224,64,0); }
  }
  .status-display.round-active {
    animation: pulse-ring 0.6s infinite;
    border-color: var(--accent);
  }

  /* Player grid */
  .players-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.85rem;
    width: 100%;
    max-width: 480px;
    margin-bottom: 2rem;
  }

  .player-card {
    border: 2px solid var(--border);
    border-radius: 8px;
    padding: 1rem;
    background: var(--surface);
    transition: border-color 0.3s, box-shadow 0.3s, transform 0.2s;
    position: relative;
    overflow: hidden;
  }

  .player-card.active-buzz {
    transform: scale(1.03);
  }

  .player-card::after {
    content: '';
    position: absolute; inset: 0;
    opacity: 0;
    transition: opacity 0.3s;
    border-radius: 6px;
  }
  .player-card.active-buzz::after {
    opacity: 0.08;
    background: var(--player-color);
  }

  .player-header {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 0.6rem;
  }

  .player-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--player-color);
    box-shadow: 0 0 6px var(--player-color);
  }

  .player-name-input {
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--dim);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 0.8rem;
    width: 100%;
    padding: 0.15rem 0;
    outline: none;
    transition: border-color 0.2s;
  }
  .player-name-input:focus { border-color: var(--player-color); }

  .player-score-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 0.5rem;
  }

  .score-label {
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    color: var(--muted);
    text-transform: uppercase;
  }

  .score-controls {
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  .score-btn {
    width: 22px; height: 22px;
    border-radius: 3px;
    border: 1px solid var(--dim);
    background: var(--bg);
    color: var(--text);
    font-size: 0.9rem;
    line-height: 1;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    display: flex; align-items: center; justify-content: center;
  }
  .score-btn:hover { background: var(--dim); border-color: var(--muted); }

  .score-value {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem;
    color: var(--player-color);
    min-width: 2ch;
    text-align: center;
    line-height: 1;
  }

  /* Control buttons */
  .controls {
    display: flex;
    gap: 0.85rem;
    width: 100%;
    max-width: 480px;
    margin-bottom: 1.5rem;
  }

  .btn-main {
    flex: 1;
    border: none;
    border-radius: 6px;
    padding: 0.9rem;
    font-family: 'DM Mono', monospace;
    font-size: 0.8rem;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
  }
  .btn-main:hover { opacity: 0.85; }
  .btn-main:active { transform: scale(0.97); }
  .btn-main:disabled { opacity: 0.25; cursor: not-allowed; }

  .btn-start {
    background: var(--accent);
    color: #000;
    font-weight: 700;
  }

  .btn-reset {
    background: var(--dim);
    color: var(--text);
  }

  /* Log */
  .log-section {
    width: 100%;
    max-width: 480px;
  }

  .log-header {
    font-size: 0.65rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.5rem;
  }

  .log-list {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.75rem;
    max-height: 180px;
    overflow-y: auto;
    font-size: 0.72rem;
    line-height: 1.9;
  }

  .log-entry {
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    padding: 0.15rem 0;
  }
  .log-entry:last-child { border-bottom: none; }
  .log-entry .ts { color: var(--dim); margin-right: 0.75rem; }
  .log-entry .ev { color: var(--text); }
  .log-entry.buzz .ev { color: var(--accent); }

  /* Buzz flash overlay */
  #buzzFlash {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 500;
    opacity: 0;
    transition: opacity 0.1s;
  }
  #buzzFlash.show { opacity: 1; }

  @media (max-width: 360px) {
    .players-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <h1>QUIZ BUZZER</h1>
  <p class="subtitle">Web Bluetooth Controller</p>
</header>

<!-- Connection bar -->
<div class="conn-bar">
  <div class="conn-dot" id="connDot"></div>
  <span class="conn-label" id="connLabel">Not connected</span>
  <button class="btn-connect" id="btnConnect" onclick="toggleConnect()">Connect</button>
</div>

<!-- Status display -->
<div class="status-display" id="statusDisplay">
  <div class="status-label">Status</div>
  <div class="status-value" id="statusValue">IDLE</div>
  <div class="status-sub" id="statusSub">Connect to begin</div>
</div>

<!-- Player cards -->
<div class="players-grid">
  <div class="player-card" id="card-1" style="--player-color: var(--p1)">
    <div class="player-header">
      <div class="player-dot"></div>
      <input class="player-name-input" id="name-1" value="Player 1" maxlength="14">
    </div>
    <div class="player-score-row">
      <span class="score-label">Score</span>
      <div class="score-controls">
        <button class="score-btn" onclick="adjustScore(1,-1)">−</button>
        <span class="score-value" id="score-1">0</span>
        <button class="score-btn" onclick="adjustScore(1,1)">+</button>
      </div>
    </div>
  </div>

  <div class="player-card" id="card-2" style="--player-color: var(--p2)">
    <div class="player-header">
      <div class="player-dot"></div>
      <input class="player-name-input" id="name-2" value="Player 2" maxlength="14">
    </div>
    <div class="player-score-row">
      <span class="score-label">Score</span>
      <div class="score-controls">
        <button class="score-btn" onclick="adjustScore(2,-1)">−</button>
        <span class="score-value" id="score-2">0</span>
        <button class="score-btn" onclick="adjustScore(2,1)">+</button>
      </div>
    </div>
  </div>

  <div class="player-card" id="card-3" style="--player-color: var(--p3)">
    <div class="player-header">
      <div class="player-dot"></div>
      <input class="player-name-input" id="name-3" value="Player 3" maxlength="14">
    </div>
    <div class="player-score-row">
      <span class="score-label">Score</span>
      <div class="score-controls">
        <button class="score-btn" onclick="adjustScore(3,-1)">−</button>
        <span class="score-value" id="score-3">0</span>
        <button class="score-btn" onclick="adjustScore(3,1)">+</button>
      </div>
    </div>
  </div>

  <div class="player-card" id="card-4" style="--player-color: var(--p4)">
    <div class="player-header">
      <div class="player-dot"></div>
      <input class="player-name-input" id="name-4" value="Player 4" maxlength="14">
    </div>
    <div class="player-score-row">
      <span class="score-label">Score</span>
      <div class="score-controls">
        <button class="score-btn" onclick="adjustScore(4,-1)">−</button>
        <span class="score-value" id="score-4">0</span>
        <button class="score-btn" onclick="adjustScore(4,1)">+</button>
      </div>
    </div>
  </div>
</div>

<!-- Control buttons -->
<div class="controls">
  <button class="btn-main btn-start" id="btnStart" disabled onclick="startRound()">▶ Start Round</button>
  <button class="btn-main btn-reset" id="btnReset" disabled onclick="resetBuzzer()">↺ Reset</button>
</div>

<!-- Event log -->
<div class="log-section">
  <div class="log-header">Event Log</div>
  <div class="log-list" id="logList">
    <div class="log-entry"><span class="ts">--:--:--</span><span class="ev">Waiting for connection...</span></div>
  </div>
</div>

<!-- Buzz flash -->
<div id="buzzFlash"></div>

<script>
// --- BLE UUIDs (must match Arduino sketch) ---
const SERVICE_UUID      = '12345678-1234-1234-1234-123456789abc';
const BUZZER_STATE_UUID = '12345678-1234-1234-1234-123456789ab1';
const RESET_UUID        = '12345678-1234-1234-1234-123456789ab2';
const ROUND_START_UUID  = '12345678-1234-1234-1234-123456789ab3';
const STATUS_UUID       = '12345678-1234-1234-1234-123456789ab4';

// --- State ---
let device = null;
let server = null;
let buzzerStateChar = null;
let resetChar = null;
let roundStartChar = null;
let scores = [0, 0, 0, 0];

const PLAYER_COLORS = ['var(--p1)', 'var(--p2)', 'var(--p3)', 'var(--p4)'];
const PLAYER_COLOR_GLOWS = [
  'rgba(255,77,109,0.15)',
  'rgba(77,170,255,0.15)',
  'rgba(77,255,158,0.15)',
  'rgba(255,159,77,0.15)'
];

// --- Connect / Disconnect ---
async function toggleConnect() {
  if (device && device.gatt.connected) {
    device.gatt.disconnect();
    return;
  }
  try {
    log('Scanning for QuizBuzzer...');
    device = await navigator.bluetooth.requestDevice({
      filters: [{ name: 'QuizBuzzer' }],
      optionalServices: [SERVICE_UUID]
    });

    device.addEventListener('gattserverdisconnected', onDisconnected);

    server = await device.gatt.connect();
    log('Connected to ' + device.name);

    const service = await server.getPrimaryService(SERVICE_UUID);

    // Buzzer state notifications
    buzzerStateChar = await service.getCharacteristic(BUZZER_STATE_UUID);
    await buzzerStateChar.startNotifications();
    buzzerStateChar.addEventListener('characteristicvaluechanged', onBuzzerState);

    // Status notifications
    const statusCharBLE = await service.getCharacteristic(STATUS_UUID);
    await statusCharBLE.startNotifications();
    statusCharBLE.addEventListener('characteristicvaluechanged', onStatus);

    // Write characteristics
    resetChar = await service.getCharacteristic(RESET_UUID);
    roundStartChar = await service.getCharacteristic(ROUND_START_UUID);

    setConnected(true);

    // Read initial state
    const initialStatus = await statusCharBLE.readValue();
    handleStatus(initialStatus.getUint8(0));

  } catch (err) {
    log('Connection failed: ' + err.message);
    console.error(err);
  }
}

function onDisconnected() {
  log('Disconnected');
  setConnected(false);
  updateStatusDisplay(0, null);
}

// --- BLE event handlers ---
function onBuzzerState(event) {
  const player = event.target.value.getUint8(0);
  if (player > 0) {
    handleBuzz(player);
  }
}

function onStatus(event) {
  handleStatus(event.target.value.getUint8(0));
}

function handleStatus(status) {
  // 0=idle, 1=round_active, 2=buzzed
  updateStatusDisplay(status, null);
}

function handleBuzz(player) {
  const name = document.getElementById('name-' + player).value || ('Player ' + player);
  log('🔔 ' + name + ' buzzed!', true);
  updateStatusDisplay(2, player);
  triggerBuzzEffect(player);
}

// --- Commands ---
async function startRound() {
  if (!roundStartChar) return;
  try {
    await roundStartChar.writeValue(new Uint8Array([1]));
    log('Round started');
    updateStatusDisplay(1, null);
    clearActiveBuzz();
  } catch (e) { log('Error: ' + e.message); }
}

async function resetBuzzer() {
  if (!resetChar) return;
  try {
    await resetChar.writeValue(new Uint8Array([1]));
    log('Buzzer reset');
    updateStatusDisplay(0, null);
    clearActiveBuzz();
  } catch (e) { log('Error: ' + e.message); }
}

// --- UI updates ---
function setConnected(connected) {
  document.getElementById('connDot').classList.toggle('connected', connected);
  document.getElementById('connLabel').textContent = connected
    ? ('Connected: ' + (device ? device.name : ''))
    : 'Not connected';
  document.getElementById('connLabel').classList.toggle('connected', connected);
  document.getElementById('btnConnect').textContent = connected ? 'Disconnect' : 'Connect';
  document.getElementById('btnStart').disabled = !connected;
  document.getElementById('btnReset').disabled = !connected;
}

const STATUS_TEXT = ['IDLE', 'READY', 'BUZZED!'];
const STATUS_SUB  = ['Waiting to start', 'Buzzers are live!', ''];

function updateStatusDisplay(status, buzzedPlayer) {
  const display = document.getElementById('statusDisplay');
  const val = document.getElementById('statusValue');
  const sub = document.getElementById('statusSub');

  display.classList.remove('round-active', 'buzzed');

  if (status === 1) {
    display.classList.add('round-active');
    val.textContent = STATUS_TEXT[1];
    val.style.color = 'var(--accent)';
    sub.textContent = STATUS_SUB[1];
  } else if (status === 2 && buzzedPlayer) {
    display.classList.add('buzzed');
    const name = document.getElementById('name-' + buzzedPlayer).value || ('Player ' + buzzedPlayer);
    val.textContent = name.toUpperCase();
    val.style.color = PLAYER_COLORS[buzzedPlayer - 1];
    sub.textContent = 'Buzzed first!';
    display.style.setProperty('--buzz-glow', PLAYER_COLOR_GLOWS[buzzedPlayer - 1]);
  } else {
    val.textContent = 'IDLE';
    val.style.color = 'var(--muted)';
    sub.textContent = server ? 'Press Start Round' : 'Connect to begin';
  }
}

function clearActiveBuzz() {
  for (let i = 1; i <= 4; i++) {
    const card = document.getElementById('card-' + i);
    card.classList.remove('active-buzz');
    card.style.borderColor = '';
    card.style.boxShadow = '';
  }
}

function triggerBuzzEffect(player) {
  clearActiveBuzz();
  const card = document.getElementById('card-' + player);
  card.classList.add('active-buzz');
  card.style.borderColor = PLAYER_COLORS[player - 1];
  card.style.boxShadow = '0 0 24px ' + PLAYER_COLOR_GLOWS[player - 1].replace('0.15', '0.5');

  // Brief screen flash
  const flash = document.getElementById('buzzFlash');
  flash.style.background = PLAYER_COLOR_GLOWS[player - 1].replace('0.15', '0.25');
  flash.classList.add('show');
  setTimeout(() => flash.classList.remove('show'), 150);
}

// --- Score management ---
function adjustScore(player, delta) {
  scores[player - 1] = Math.max(0, scores[player - 1] + delta);
  document.getElementById('score-' + player).textContent = scores[player - 1];
}

// --- Event log ---
function log(message, isBuzz = false) {
  const list = document.getElementById('logList');
  const now = new Date();
  const ts = now.toTimeString().slice(0, 8);

  const entry = document.createElement('div');
  entry.className = 'log-entry' + (isBuzz ? ' buzz' : '');
  entry.innerHTML = `<span class="ts">${ts}</span><span class="ev">${message}</span>`;

  // Clear placeholder
  if (list.children.length === 1 && list.children[0].querySelector('.ts')?.textContent === '--:--:--') {
    list.innerHTML = '';
  }

  list.prepend(entry);

  // Keep log from growing too large
  while (list.children.length > 50) list.removeChild(list.lastChild);
}

// --- Check Web Bluetooth support ---
if (!navigator.bluetooth) {
  document.getElementById('btnConnect').disabled = true;
  document.getElementById('connLabel').textContent = 'Web Bluetooth not supported (use Chrome on Android/Desktop)';
  log('⚠ Web Bluetooth not available in this browser');
}
</script>
</body>
</html>
